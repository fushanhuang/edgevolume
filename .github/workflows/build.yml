name: Build EdgeVolume IPA

on:
  workflow_dispatch:   # 在 Actions 页面手动触发
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # xcodegen：由 project.yml 生成 EdgeVolume.xcodeproj
      # ldid：把私有 entitlements 写入 Mach-O（巨魔必需）
      - name: Install dependencies
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate
          echo "===== 生成的工程文件 ====="
          find EdgeVolume.xcodeproj -type f | sort
          echo "===== objectVersion ====="
          grep -o 'objectVersion = [0-9]*' EdgeVolume.xcodeproj/project.pbxproj | head -1

      # 诊断：plutil 只能 lint 标准 plist（XML/binary），
      # pbxproj 是 OpenStep 格式、scheme/workspace 是 Xcode 私有 plist，
      # 对它们跑 plutil 只会得到误报，因此只检查标准 plist
      - name: Diagnose project files
        run: |
          for f in EdgeVolume/Info.plist EdgeVolume/entitlements.plist; do
            echo "----- plutil -lint $f -----"
            plutil -lint "$f"
          done
          echo "===== pbxproj 编码 / 行尾 / 转义符统计 ====="
          head -3 EdgeVolume.xcodeproj/project.pbxproj | od -c | head -6
          printf 'backslash: %s\n' "$(grep -c '\\' EdgeVolume.xcodeproj/project.pbxproj || true)"
          printf 'CR: %s\n' "$(grep -c $'\r' EdgeVolume.xcodeproj/project.pbxproj || true)"

      # 工程解析验证（含 objectVersion 自动降级垫片）、编译、
      # ldid 签名、打包 tipa 全部在 build-ipa.sh 内完成
      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeVolume.tipa
          path: EdgeVolume.tipa
          if-no-files-found: error
