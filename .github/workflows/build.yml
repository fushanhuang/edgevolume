name: Build EdgeVolume IPA

on:
  workflow_dispatch:   # 在 Actions 页面手动触发
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # ldid 用于把私有 entitlements 写入 Mach-O（巨魔必需）
      # 说明：本仓库已内置 EdgeVolume.xcodeproj，无需 xcodegen
      - name: Install dependencies
        run: brew install ldid

      # 诊断：用 plutil -lint 精确定位 pbxproj / plist 的语法错误行号
      - name: Diagnose project files
        run: |
          echo "===== .xcodeproj 文件清单 ====="
          find EdgeVolume.xcodeproj -type f | sort
          for f in EdgeVolume.xcodeproj/project.pbxproj \
                   EdgeVolume/Info.plist \
                   EdgeVolume/entitlements.plist \
                   EdgeVolume.xcodeproj/xcshareddata/xcschemes/EdgeVolume.xcscheme \
                   EdgeVolume.xcodeproj/project.xcworkspace/contents.xcworkspacedata; do
            echo "----- plutil -lint $f -----"
            plutil -lint "$f" || true
          done
          echo "===== pbxproj 前 6 行（检查 BOM/编码）====="
          head -6 EdgeVolume.xcodeproj/project.pbxproj | od -c | head -12
          echo "===== 反斜杠与 CRLF 统计 ====="
          printf 'backslash: %s\n' "$(grep -c '\\' EdgeVolume.xcodeproj/project.pbxproj || true)"
          printf 'CR: %s\n' "$(grep -c $'\r' EdgeVolume.xcodeproj/project.pbxproj || true)"
          echo "===== xcodebuild -list -json ====="
          xcodebuild -project EdgeVolume.xcodeproj -list -json || true

      - name: Show schemes
        run: xcodebuild -project EdgeVolume.xcodeproj -list

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeVolume.tipa
          path: EdgeVolume.tipa
          if-no-files-found: error
